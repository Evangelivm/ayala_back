# Postgres endurecido.
# - Sin secretos en el archivo: se leen de .env (ver .env.example). Falla si faltan.
# - Postgres NO publica puertos; solo pgbouncer, y solo en 127.0.0.1 (acceso remoto: túnel SSH).
# - Red interna aislada entre db y pgbouncer; solo pgbouncer toca shared_network.
# - Autenticación scram-sha-256 y pg_hba.conf restrictivo.
# - Contenedores sin privilegios, filesystem de solo lectura, con límites de CPU/RAM/PIDs
#   (un minero no puede disparar el consumo del VPS).

services:
  db:
    image: postgres:17
    container_name: ayala_postgres
    restart: unless-stopped
    # Sin "ports": nadie fuera de la red interna puede alcanzar Postgres.
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - max_connections=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayala_01}
      POSTGRES_USER: ${POSTGRES_USER:-nestuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - db_internal
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    pids_limit: 200
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0 # tag fijado a propósito; actualizar a mano tras probar
    container_name: ayala_pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo loopback del VPS. Para acceso remoto: ssh -L 5432:127.0.0.1:5432 usuario@vps
      - '127.0.0.1:${PGBOUNCER_BIND_PORT:-5432}:6432'
    environment:
      # Nombre único: "db" es ambiguo porque shared_network lo comparte con otros stacks.
      DB_HOST: ayala_postgres
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER:-nestuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DB_NAME: ${POSTGRES_DB:-ayala_01}
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      SERVER_RESET_QUERY: 'DISCARD ALL'
      IGNORE_STARTUP_PARAMETERS: 'extra_float_digits'
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '30'
      MIN_POOL_SIZE: '10'
      RESERVE_POOL_SIZE: '5'
      SERVER_IDLE_TIMEOUT: '300'
    networks:
      - db_internal
      - shared_network
    read_only: true
    # El entrypoint genera pgbouncer.ini y userlist.txt al arrancar, por eso /etc/pgbouncer es tmpfs.
    tmpfs:
      - /tmp
      - /etc/pgbouncer:mode=1777
      - /var/log/pgbouncer:mode=1777
      - /var/run/pgbouncer:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

networks:
  # internal: true => sin salida a internet ni acceso desde fuera
  db_internal:
    internal: true
  shared_network:
    external: true

volumes:
  postgres_data:
    # Volumen manejado por Docker, sin configuración adicional
